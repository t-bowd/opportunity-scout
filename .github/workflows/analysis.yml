name: Forward-Return Analysis

on:
  workflow_dispatch:
    inputs:
      horizon:
        description: "Return horizon"
        required: false
        default: "30d"
        type: choice
        options: ["30d", "90d"]

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Forward-return analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run_analysis.py ${{ inputs.horizon == '90d' && '--90d' || '' }}
