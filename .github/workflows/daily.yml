name: Daily Collection

on:
  schedule:
    # THREE runs across the US session for REDUNDANCY, not because we want to trade
    # three times. GitHub Actions' scheduled-event queue backs up under load and has
    # been firing these HOURS late (observed 3–8.7h), repeatedly landing the run AFTER
    # the 20:00 UTC close — where the broker (Alpaca) refuses live BUYs (market closed)
    # and every live entry defers, so open slots never refill. Live BUYs need a run
    # that lands inside market hours (13:30–20:00 UTC summer / 14:30–21:00 winter).
    #
    # One schedule can't guarantee that against a variable multi-hour lag, so we fire
    # several and let the idempotency guard in run_daily.py make the extras cheap
    # (collect+score once/day; the cheap trade stages re-run and fill any slots the
    # earlier run deferred, and reconcile records any stop that filled meanwhile).
    #
    # WIDENED 2026-10-26 to add 11:00 and 13:00. The 14:00/16:00/18:00 trio was
    # calibrated for ~5h of lag and kept losing: on 2026-10-05 all three fired after
    # the close, on 2026-10-07 none fired at all, and on 2026-10-26 none fired while
    # two positions had stopped out at the broker — so the book sat stale, believing
    # it held names it no longer did, with freed cash unrecognised and slots idle.
    # Observed lag runs 2.5–7.5h, so an 11:00 start covers the whole range: on time it
    # is pre-open and simply defers entries (harmless — reconcile and exits still
    # run), and anywhere from +2.5h to +7.5h late it lands inside 13:30–20:00. 13:00
    # covers the shorter-lag case and the winter open (14:30 UTC).
    #
    # The earliest slots are deliberately allowed to be pre-open: a run that defers
    # entries still reconciles broker fills and processes exits, which is exactly the
    # staleness that bit on 2026-10-26.
    # 7 days/week (weekend runs still process news + paper exits; entries just defer).
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily collection + scoring
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: python run_daily.py
